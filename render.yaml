# render.yaml — Render.com deployment configuration

services:
  - type: web
    name: ai-trading-engine
    env: python
    plan: free

    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13   # 🔥 VERY IMPORTANT (fixes your error)

      - key: ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: AI_CACHE_TTL
        value: "900"
      - key: CACHE_TTL_HOURS
        value: "4"
      - key: CORS_ORIGINS
        value: "*"