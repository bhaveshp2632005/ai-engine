services:
  - type: web
    name: ai-trading-engine
    env: python
    # pythonVersion here is for display only — runtime.txt controls the actual version
    # But include it anyway for newer Render dashboard versions
    pythonVersion: "3.10.13"
    plan: free
    buildCommand: pip install --upgrade pip setuptools wheel && pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: AI_CACHE_TTL
        value: "900"
      - key: CORS_ORIGINS
        value: "*"
